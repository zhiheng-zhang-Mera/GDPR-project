name: Continuous verification

on:
  push:
    branches: [9-8-Finalize, master]
  pull_request:
    branches: [9-8-Finalize, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run reproduce:thesis-core
